name: Statify
version: '${project.version}'
main: dev.quantumbagel.statify.Statify
api-version: '1.21'
description: Leaderboards and custom stat queries built on Minecraft's own statistics
author: quantumbagel
commands:
  leaderboard:
    description: Rank every player by a stat or a query
    usage: /<command> [count] <query>, e.g. /<command> 5 killed:zombie + killed:skeleton
    aliases: [lb]
    permission: statify.leaderboard
  stat:
    description: A player's top stats in a category, or their results for someone's custom queries
    usage: /<command> [player] <category|query owner> [count]
    permission: statify.stat
  custom:
    description: Save, view and delete custom queries
    usage: /<command> list [player] | get [player] <name> | set <name> <query> | delete <name>
    permission: statify.custom
permissions:
  statify.leaderboard:
    default: true
  statify.stat:
    default: true
  statify.custom:
    default: true
